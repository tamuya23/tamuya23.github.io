<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tamuya23</title>
<meta name="description" content="tamuya23 的个人主页">
<style>
  :root {
    --bg: #fbfbfa;
    --fg: #1a1a18;
    --muted: #6b6b66;
    --rule: #e4e4e0;
    --accent: #2f6f4e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16171a;
      --fg: #ececea;
      --muted: #9a9a94;
      --rule: #2c2d31;
      --accent: #7fc9a0;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16171a;
    --fg: #ececea;
    --muted: #9a9a94;
    --rule: #2c2d31;
    --accent: #7fc9a0;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 ui-sans-serif, -apple-system, "SF Pro Text",
          "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 34rem;
    margin: 0 auto;
    padding: 18vh 16px 6rem;
  }
  h1 {
    font-size: 2rem;
    letter-spacing: -0.02em;
    margin: 0 0 .4rem;
    font-weight: 600;
  }
  .tagline { color: var(--muted); margin: 0 0 2.5rem; }
  h2 {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    font-weight: 600;
    margin: 0 0 .9rem;
  }
  ul { list-style: none; padding: 0; margin: 0 0 2.5rem; }
  li { padding: .55rem 0; border-bottom: 1px solid var(--rule); }
  li:last-child { border-bottom: 0; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .note { color: var(--muted); font-size: .85rem; }
  footer {
    border-top: 1px solid var(--rule);
    padding-top: 1.2rem;
    color: var(--muted);
    font-size: .82rem;
  }
</style>
</head>
<body>
<main>
  <h1>tamuya23</h1>
  <p class="tagline">写代码，做研究。</p>

  <h2>项目</h2>
  <ul>
    <li>
      <a href="https://github.com/tamuya23/OntoAnno_Agent">OntoAnno_Agent</a>
      <span class="note">— 细胞类型自动注释 Agent</span>
    </li>
    <li>
      <a href="https://github.com/tamuya23/Quant-Research">Quant-Research</a>
      <span class="note">— 因子、遗传算法与加密货币研究</span>
    </li>
  </ul>

  <h2>链接</h2>
  <ul>
    <li><a href="https://github.com/tamuya23">GitHub</a></li>
  </ul>

  <footer>tamuya23.com</footer>
</main>
</body>
</html>
